# Miniprojeto DevOps com GenAI — pipeline de testes + diagnóstico por IA.
# O laboratório oficial da disciplina é GitLab CI; o equivalente demonstrativo
# está em miniprojeto-devops-genai/.gitlab-ci.yml.
name: devops-genai

on:
  pull_request:
    # labeled/unlabeled: a label "inject-bug" liga/desliga a injeção de
    # falha no job test; os três primeiros são os defaults do gatilho.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      inject_bug:
        description: "Injetar bug proposital no stub (quebra a deduplicação do webhook)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # inject_bug é o nome voltado a quem dispara o pipeline; o stub lê a
      # config EVENT_REGISTRY_MODE (ver miniprojeto-devops-genai/README.md).
      # Vira "deferred" em workflow_dispatch com inject_bug=true OU em
      # pull_request com a label "inject-bug"; senão "sync" (padrão).
      EVENT_REGISTRY_MODE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.inject_bug == true) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'inject-bug'))) && 'deferred' || 'sync' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes do stub
        shell: bash
        # pipefail garante que o exit code reprovador é o do Maven, não o do tee
        run: |
          set -o pipefail
          mvn -B -f forum-testes-integracao/stub/pom.xml test 2>&1 | tee maven-test.log

      - name: Publicar log e relatórios surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: |
            maven-test.log
            forum-testes-integracao/stub/target/surefire-reports/
          if-no-files-found: warn

  ai-diagnosis:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # histórico completo para o coletor conseguir o diff do PR
          fetch-depth: 0

      - name: Baixar log dos testes
        uses: actions/download-artifact@v4
        with:
          name: resultado-testes
          path: resultado-testes

      # Gera os prompts sanitizados e dois pareceres (sem/com contexto de
      # decisões) via API do Groq (secret GROQ_API_KEY); publica no step
      # summary e, em PR, como UM comentário via gh api. Sem a chave (e sem
      # claude CLI) o job NÃO falha: os prompts viram artefato para gerar
      # os pareceres localmente (ver miniprojeto-devops-genai/README.md).
      - name: Diagnóstico por IA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # MODEL_GROQ: openai/gpt-oss-120b   # default do script
          # O Groq estima entrada + max_tokens (2048) contra o TPM de 8000
          # do free tier e responde 413 quando estoura — e 413 não se
          # resolve com retry, só reduzindo o payload. Com os anexos no
          # default de 8KB cada a estimativa chegou a ~8,5k tokens; com
          # 4KB cada a entrada cai ~2k tokens (~6,5k no total, folga ~1,5k).
          MAX_BYTES_ANEXO: "4000"
        run: bash miniprojeto-devops-genai/agente/diagnostico.sh resultado-testes/maven-test.log

      - name: Publicar prompt e parecer do diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          if-no-files-found: warn
