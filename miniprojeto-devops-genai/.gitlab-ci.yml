# Equivalente GitLab CI do workflow .github/workflows/devops-genai.yml.
# Arquivo DEMONSTRATIVO: o laboratório oficial da disciplina roda em GitLab,
# mas este repositório vive no GitHub — para usar de verdade, mova este
# arquivo para a raiz de um projeto GitLab como .gitlab-ci.yml.
#
# Para simular o "workflow_dispatch com inject_bug": rode um pipeline manual
# (CI/CD > Pipelines > Run pipeline) definindo a variável INJECT_BUG=true.

stages:
  - test
  - ai_diagnosis

variables:
  INJECT_BUG: "false" # sobrescrevível em pipeline manual
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    # INJECT_BUG é o nome voltado a quem dispara o pipeline; o stub lê a
    # config EVENT_REGISTRY_MODE (ver README.md deste diretório).
    - export EVENT_REGISTRY_MODE=$([ "$INJECT_BUG" = "true" ] && echo deferred || echo sync)
    # pipefail garante que o exit code reprovador é o do Maven, não o do tee
    - set -o pipefail
    - mvn -B -f forum-testes-integracao/stub/pom.xml test 2>&1 | tee maven-test.log
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - maven-test.log
      - forum-testes-integracao/stub/target/surefire-reports/
    reports:
      junit: forum-testes-integracao/stub/target/surefire-reports/TEST-*.xml

ai_diagnosis:
  stage: ai_diagnosis
  image: maven:3.9-eclipse-temurin-17
  when: on_failure
  variables:
    # evita 413 no free tier do Groq: a estimativa entrada + max_tokens
    # precisa caber no TPM de 8000 (ver README, "Orçamento de tamanho")
    MAX_BYTES_ANEXO: "4000"
  dependencies:
    - test # baixa os artefatos do job test (maven-test.log + surefire)
  script:
    # o coletor de contexto é Python; a imagem maven não traz python3
    - command -v python3 >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
    # GROQ_API_KEY: variável de CI/CD mascarada e protegida do projeto;
    # sem ela (e sem claude CLI) o script não falha — prompts viram artefato
    - bash miniprojeto-devops-genai/agente/diagnostico.sh maven-test.log
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - diagnostico/
